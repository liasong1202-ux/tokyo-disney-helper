<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Stars background -->
  <circle cx="120" cy="90" r="3" fill="#fde047" opacity="0.8" />
  <circle cx="280" cy="140" r="2" fill="#fde047" opacity="0.6" />
  <circle cx="980" cy="110" r="3.5" fill="#fde047" opacity="0.9" />
  <circle cx="1080" cy="180" r="2.5" fill="#fde047" opacity="0.7" />

  <!-- Badge Tag -->
  <rect x="80" y="80" width="280" height="42" rx="21" fill="#f59e0b" />
  <text x="220" y="107" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="18" fill="#0f172a" text-anchor="middle">🏰 2026-2027 即時情報站</text>

  <!-- Main Title -->
  <text x="80" y="190" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="52" fill="#ffffff">東京迪士尼門票降價與人潮預報</text>
  <text x="80" y="260" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="46" fill="url(#gold)">台幣即時低價日曆・開賣第一秒通知</text>

  <!-- Subtitle features -->
  <text x="80" y="340" font-family="'Noto Sans TC', sans-serif" font-weight="600" font-size="24" fill="#cbd5e1">✓ 日圓實時換算台幣低價日曆  ✓ 入園前 2 個月開賣前通知</text>
  <text x="80" y="380" font-family="'Noto Sans TC', sans-serif" font-weight="600" font-size="24" fill="#cbd5e1">✓ Klook / KKday 平台比價折扣碼  ✓ 設施維修與海風停運預報</text>

  <!-- 5 Character Badge Preview Box -->
  <rect x="80" y="440" width="1040" height="130" rx="20" fill="#1e293b" stroke="#4338ca" stroke-width="2" />
  <text x="110" y="475" font-family="'Noto Sans TC', sans-serif" font-weight="800" font-size="18" fill="#a5b4fc">5 位經典迪士尼角色守護預約搶票大使：</text>
  
  <text x="120" y="525" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="20" fill="#ffffff">👑 米奇（歡慶隊長）  💖 米妮（甜美大使）  ⚡ 唐老鴨（衝鋒搶票）  🧸 達菲（溫暖海洋）  🍯 維尼（甜蜜好運）</text>
  <text x="120" y="555" font-family="'Noto Sans TC', sans-serif" font-weight="500" font-size="16" fill="#94a3b8">門票開放預訂當天，專屬角色圖文賀信第一秒送達！</text>
</svg>

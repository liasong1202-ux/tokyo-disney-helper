<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-duffy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-duffy)" stroke="#fef3c7" stroke-width="5" />

  <!-- Duffy Ears -->
  <circle cx="60" cy="68" r="26" fill="#d97706" stroke="#92400e" stroke-width="2" />
  <circle cx="60" cy="68" r="16" fill="#fde68a" />
  <circle cx="140" cy="68" r="26" fill="#d97706" stroke="#92400e" stroke-width="2" />
  <circle cx="140" cy="68" r="16" fill="#fde68a" />

  <!-- Duffy Head Main -->
  <ellipse cx="100" cy="112" rx="46" ry="42" fill="#d97706" />

  <!-- Sailor Hat on Duffy -->
  <ellipse cx="100" cy="64" rx="20" ry="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" />
  <rect x="96" y="52" width="8" height="12" fill="#3b82f6" />

  <!-- Face Patch / Muzzle (Beige) -->
  <path d="M 100 86 C 85 86 74 96 74 112 C 74 128 85 138 100 138 C 115 138 126 128 126 112 C 126 96 115 86 100 86 Z" fill="#fef3c7" />

  <!-- Duffy Eyes -->
  <circle cx="86" cy="106" r="6" fill="#451a03" />
  <circle cx="114" cy="106" r="6" fill="#451a03" />
  <circle cx="88" cy="104" r="2" fill="#ffffff" />
  <circle cx="116" cy="104" r="2" fill="#ffffff" />

  <!-- Duffy Heart-shaped Nose -->
  <path d="M 100 120 C 97 114 92 115 92 119 C 92 122 100 126 100 126 C 100 126 108 122 108 119 C 108 115 103 114 100 120 Z" fill="#78350f" />

  <!-- Soft Smile -->
  <path d="M 94 127 Q 100 133 106 127" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

  <!-- Duffy Mickey-head Cheek Imprints -->
  <g fill="#ca8a04" opacity="0.4">
    <circle cx="78" cy="120" r="2.5" />
    <circle cx="76" cy="117" r="1.5" />
    <circle cx="80" cy="117" r="1.5" />
    <circle cx="122" cy="120" r="2.5" />
    <circle cx="120" cy="117" r="1.5" />
    <circle cx="124" cy="117" r="1.5" />
  </g>

  <!-- Sailor Collar -->
  <path d="M 78 146 L 100 156 L 122 146" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" />

  <!-- Congratulation Ribbon Tag -->
  <rect x="25" y="160" width="150" height="26" rx="13" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="100" y="178" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="13" fill="#78350f" text-anchor="middle">🧸 達菲：暖暖開賣囉！</text>

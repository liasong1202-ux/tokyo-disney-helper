<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-minnie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-minnie)" stroke="#fbcfe8" stroke-width="5" />
  
  <!-- Tiny floating hearts -->
  <path d="M 35 48 A 4 4 0 0 0 31 44 A 4 4 0 0 0 27 48 Q 27 53 31 56 L 31 56 Q 35 53 35 48 Z" fill="#fbcfe8" />
  <path d="M 170 52 A 4 4 0 0 0 166 48 A 4 4 0 0 0 162 52 Q 162 57 166 60 L 166 60 Q 170 57 170 52 Z" fill="#fbcfe8" />

  <!-- Minnie Ears -->
  <circle cx="58" cy="74" r="36" fill="#18181b" />
  <circle cx="142" cy="74" r="36" fill="#18181b" />

  <!-- Minnie Head Main -->
  <circle cx="100" cy="116" r="48" fill="#18181b" />

  <!-- Big Red Polka Dot Bow -->
  <g id="minnie-bow">
    <ellipse cx="76" cy="62" rx="22" ry="16" fill="#e11d48" transform="rotate(-15 76 62)" stroke="#ffe4e6" stroke-width="2" />
    <ellipse cx="124" cy="62" rx="22" ry="16" fill="#e11d48" transform="rotate(15 124 62)" stroke="#ffe4e6" stroke-width="2" />
    <circle cx="100" cy="64" r="13" fill="#be123c" stroke="#ffe4e6" stroke-width="2" />
    <!-- White dots on bow -->
    <circle cx="70" cy="60" r="3.5" fill="#ffffff" />
    <circle cx="82" cy="66" r="3.5" fill="#ffffff" />
    <circle cx="130" cy="60" r="3.5" fill="#ffffff" />
    <circle cx="118" cy="66" r="3.5" fill="#ffffff" />
    <circle cx="100" cy="64" r="3" fill="#ffffff" />
  </g>

  <!-- Face mask -->
  <path d="M 100 89 C 85 89 71 98 71 115 C 71 135 85 146 100 146 C 115 146 129 135 129 115 C 129 98 115 89 100 89 Z" fill="#ffedd5" />
  <ellipse cx="80" cy="122" rx="14" ry="16" fill="#ffedd5" />
  <ellipse cx="120" cy="122" rx="14" ry="16" fill="#ffedd5" />

  <!-- Eyes with eyelashes -->
  <ellipse cx="91" cy="115" rx="4.5" ry="9" fill="#18181b" />
  <ellipse cx="109" cy="115" rx="4.5" ry="9" fill="#18181b" />
  <ellipse cx="92" cy="112" rx="1.5" ry="3" fill="#ffffff" />
  <ellipse cx="110" cy="112" rx="1.5" ry="3" fill="#ffffff" />
  <!-- Eyelashes -->
  <line x1="86" y1="108" x2="81" y2="104" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
  <line x1="90" y1="106" x2="87" y2="101" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
  <line x1="114" y1="108" x2="119" y2="104" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
  <line x1="110" y1="106" x2="113" y2="101" stroke="#18181b" stroke-width="2" stroke-linecap="round" />

  <!-- Nose -->
  <ellipse cx="100" cy="127" rx="6.5" ry="4" fill="#18181b" />

  <!-- Smile -->
  <path d="M 85 130 Q 100 148 115 130" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
  <path d="M 90 135 Q 100 146 110 135 Z" fill="#f43f5e" />

  <!-- Congratulation Ribbon Tag -->
  <rect x="25" y="160" width="150" height="26" rx="13" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2" />
  <text x="100" y="178" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="13" fill="#9f1239" text-anchor="middle">💖 米妮：甜美開賣囉！</text>
</svg>

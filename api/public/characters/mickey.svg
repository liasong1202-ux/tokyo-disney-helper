<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-mickey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-mickey)" stroke="#fde047" stroke-width="5" />
  
  <!-- Magic sparkles -->
  <circle cx="35" cy="45" r="4" fill="#fef08a" />
  <circle cx="165" cy="50" r="3" fill="#fef08a" />
  <polygon points="100,12 103,24 115,27 103,30 100,42 97,30 85,27 97,24" fill="#fde047" />

  <!-- Mickey Ears -->
  <circle cx="58" cy="72" r="36" fill="#18181b" />
  <circle cx="142" cy="72" r="36" fill="#18181b" />

  <!-- Mickey Head Main -->
  <circle cx="100" cy="115" r="48" fill="#18181b" />

  <!-- Face mask / flesh -->
  <path d="M 100 86 C 85 86 70 96 70 114 C 70 134 85 146 100 146 C 115 146 130 134 130 114 C 130 96 115 86 100 86 Z" fill="#ffedd5" />
  <!-- Cheek accents -->
  <ellipse cx="80" cy="120" rx="14" ry="16" fill="#ffedd5" />
  <ellipse cx="120" cy="120" rx="14" ry="16" fill="#ffedd5" />

  <!-- Eyes -->
  <ellipse cx="91" cy="112" rx="4.5" ry="9" fill="#18181b" />
  <ellipse cx="109" cy="112" rx="4.5" ry="9" fill="#18181b" />
  <ellipse cx="92" cy="109" rx="1.5" ry="3" fill="#ffffff" />
  <ellipse cx="110" cy="109" rx="1.5" ry="3" fill="#ffffff" />

  <!-- Nose -->
  <ellipse cx="100" cy="125" rx="6.5" ry="4" fill="#18181b" />

  <!-- Big Smile -->
  <path d="M 84 128 Q 100 148 116 128" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
  <path d="M 89 133 Q 100 146 111 133 Z" fill="#dc2626" />

  <!-- Congratulation Ribbon Tag -->
  <rect x="25" y="160" width="150" height="26" rx="13" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <text x="100" y="178" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="13" fill="#854d0e" text-anchor="middle">🎉 米奇：可以買票囉！</text>
</svg>

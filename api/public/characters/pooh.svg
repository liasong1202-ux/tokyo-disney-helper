<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-pooh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-pooh)" stroke="#fef08a" stroke-width="5" />

  <!-- Honey drops / sparkles -->
  <circle cx="36" cy="48" r="4" fill="#fef08a" />
  <circle cx="166" cy="46" r="3" fill="#fef08a" />

  <!-- Pooh Ears -->
  <circle cx="68" cy="65" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  <circle cx="132" cy="65" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2" />

  <!-- Pooh Head Main (Golden Yellow) -->
  <ellipse cx="100" cy="108" rx="44" ry="40" fill="#facc15" stroke="#ca8a04" stroke-width="2" />

  <!-- Pooh Eyebrows -->
  <path d="M 82 88 Q 88 85 92 88" fill="none" stroke="#713f12" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 108 88 Q 112 85 118 88" fill="none" stroke="#713f12" stroke-width="2.5" stroke-linecap="round" />

  <!-- Pooh Eyes -->
  <ellipse cx="87" cy="98" rx="4" ry="6" fill="#451a03" />
  <ellipse cx="113" cy="98" rx="4" ry="6" fill="#451a03" />

  <!-- Pooh Nose / Snout -->
  <ellipse cx="100" cy="116" rx="18" ry="12" fill="#fde047" />
  <ellipse cx="100" cy="112" rx="6" ry="4" fill="#451a03" />

  <!-- Pooh Sweet Smile -->
  <path d="M 92 118 Q 100 126 108 118" fill="none" stroke="#713f12" stroke-width="2.5" stroke-linecap="round" />

  <!-- Red Shirt Collar -->
  <path d="M 72 144 C 82 140 100 148 100 148 C 100 148 118 140 128 144 L 132 154 L 68 154 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

  <!-- Congratulation Ribbon Tag -->
  <rect x="25" y="160" width="150" height="26" rx="13" fill="#fef9c3" stroke="#eab308" stroke-width="2" />
  <text x="100" y="178" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="13" fill="#854d0e" text-anchor="middle">🍯 維尼：甜蜜開賣囉！</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-donald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="beak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="100" cy="100" r="95" fill="url(#bg-donald)" stroke="#fbbf24" stroke-width="5" />

  <!-- Speed Stars -->
  <polygon points="30,45 34,48 30,51 32,48" fill="#fef08a" />
  <polygon points="170,45 174,48 170,51 172,48" fill="#fef08a" />

  <!-- Donald Sailor Hat Black Ribbon (hanging to the right) -->
  <path d="M 125 42 Q 148 48 156 68 Q 146 66 138 56 Z" fill="#0f172a" />
  <path d="M 130 46 Q 160 58 166 80 Q 155 76 144 63 Z" fill="#1e293b" />

  <!-- Donald Sailor Cap (Tilted Blue Beret) -->
  <ellipse cx="100" cy="42" rx="36" ry="16" fill="#1d4ed8" transform="rotate(-8 100 42)" />
  <ellipse cx="98" cy="38" rx="28" ry="11" fill="#3b82f6" transform="rotate(-8 98 38)" />
  <!-- Cap Pom/Button -->
  <circle cx="98" cy="28" r="6" fill="#0f172a" />

  <!-- White Duck Head -->
  <ellipse cx="100" cy="98" rx="46" ry="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- Fluffy White Cheek Feathers (Left) -->
  <path d="M 58 92 C 44 98 42 108 50 114 C 54 112 58 106 60 102 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- Fluffy White Cheek Feathers (Right) -->
  <path d="M 142 92 C 156 98 158 108 150 114 C 146 112 142 106 140 102 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Donald Duck Blue Eyes -->
  <ellipse cx="88" cy="84" rx="7" ry="13" fill="#0284c7" />
  <ellipse cx="112" cy="84" rx="7" ry="13" fill="#0284c7" />
  <!-- Pupils -->
  <ellipse cx="89" cy="84" rx="4" ry="8" fill="#0f172a" />
  <ellipse cx="111" cy="84" rx="4" ry="8" fill="#0f172a" />
  <!-- Catchlight sparkles -->
  <circle cx="87" cy="80" r="2.5" fill="#ffffff" />
  <circle cx="109" cy="80" r="2.5" fill="#ffffff" />
  <!-- Eyelids / Expression -->
  <path d="M 80 73 Q 88 70 96 75" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 104 75 Q 112 70 120 73" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />

  <!-- Donald Signature Duck Bill (Upper Beak) -->
  <path d="M 64 104 C 64 92 136 92 136 104 C 136 122 100 128 64 104 Z" fill="url(#beak-grad)" stroke="#b45309" stroke-width="2" />
  <ellipse cx="100" cy="100" rx="26" ry="6" fill="#fbbf24" opacity="0.6" />
  <!-- Nostrils -->
  <ellipse cx="94" cy="99" rx="1.5" ry="2" fill="#78350f" />
  <ellipse cx="106" cy="99" rx="1.5" ry="2" fill="#78350f" />

  <!-- Wide Smiling Open Mouth (Lower Beak) -->
  <path d="M 74 110 Q 100 136 126 110 Z" fill="#991b1b" stroke="#b45309" stroke-width="2" />
  <!-- Pink Tongue -->
  <ellipse cx="100" cy="122" rx="11" ry="6" fill="#f43f5e" />
  <!-- Lower Beak Lip Outline -->
  <path d="M 72 110 Q 100 144 128 110" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

  <!-- Red Sailor Bowtie -->
  <path d="M 100 142 L 80 134 L 82 152 Z" fill="#dc2626" />
  <path d="M 100 142 L 120 134 L 118 152 Z" fill="#dc2626" />
  <circle cx="100" cy="142" r="4.5" fill="#b91c1c" />

  <!-- Character Tag Banner -->
  <rect x="25" y="162" width="150" height="24" rx="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <text x="100" y="179" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="12" fill="#854d0e" text-anchor="middle">⚡ 唐老鴨：衝啊搶票啦！</text>
</svg>
